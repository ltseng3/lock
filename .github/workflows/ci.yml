name: build
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install RDMA development headers
        run: sudo apt-get update && sudo apt-get install -y libibverbs-dev
      - name: Build and test
        run: |
          cmake -S . -B build -DLOCK_WITH_RDMA=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
          python3 -m unittest discover -s tests/python -v

  cmake-3-16:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu 20.04 toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++-10 libibverbs-dev python3
      - name: Build and test with system CMake 3.16
        run: |
          cmake --version
          CXX=g++-10 cmake -S . -B build-legacy -DLOCK_WITH_RDMA=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-legacy -- -j2
          (cd build-legacy && ctest --output-on-failure)
          python3 -m unittest discover -s tests/python -v
